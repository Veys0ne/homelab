#################################################################
# Installation
#################################################################

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
    cache_valid_time: 3600

#################################################################
# Creation of the directories
#################################################################

- name: Ensure backup mount point exists
  ansible.builtin.file:
    path: "{{ restic_backup_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"


#################################################################
# Restic configuration
#################################################################

- name: Create Restic configuration directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"
    
- name: Debug Restic password
  ansible.builtin.debug:
    var: restic_password

- name: Deploy Restic password 
  ansible.builtin.template:
    src: password.j2
    dest: /etc/restic/password #"{{ restic_password_file }}"
    owner: root
    group: root
    mode: "0600"
  # no_log: true # to avoid leaking some secret data

#################################################################
# Backup disk
#################################################################

- name: Configure backup disk in fstab
  ansible.posix.mount:
    path: "{{ restic_backup_mount }}"
    src: "UUID={{ restic_backup_uuid }}"
    fstype: "{{ restic_backup_filesystem }}"
    opts: defaults,nofail
    dump: "0"
    passno: "2"
    state: mounted

#################################################################
# Initialization
#################################################################

- name: Repository verification
  ansible.builtin.stat:
    path: "{{ restic_repository }}/config"
  register: restic_repository_config

- name: Initialize Restic repository
  ansible.builtin.command:
    cmd: >
      restic init 
      --repo "{{ restic_repository }}"
      --password-file "{{ restic_password_file }}"
    when: not restic_repository_config.stat.exists