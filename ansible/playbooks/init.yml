- name: Bootstrap Debian server
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install useful packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - vim
          - git
          - htop
          - lm-sensors
          - unzip
          - smartmontools
        state: present
